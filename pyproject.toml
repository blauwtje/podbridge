[project]
name = "podbridge"
version = "0.1.0"
description = "Use AirPods Pro 3 as mic and output at once on Windows through a user-mode Bluetooth host"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "bumble==0.0.236",
    "av>=19",
    "libusb_package",
    "PyAudioWPatch; sys_platform == 'win32'",
    "pycaw; sys_platform == 'win32'",
    "pywebview; sys_platform == 'win32'",
]

[project.scripts]
podbridge = "podbridge.__main__:main"

[dependency-groups]
dev = ["pytest", "pyinstaller"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
